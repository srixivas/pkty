name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpcap-dev gcc-aarch64-linux-gnu

      - name: Build
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -trimpath -X main.version=${VERSION}"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_linux_amd64.tar.gz pkty
          rm pkty

          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_linux_arm64.tar.gz pkty
          rm pkty

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -trimpath -X main.version=${VERSION}"

          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_darwin_arm64.tar.gz pkty
          rm pkty

          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_darwin_amd64.tar.gz pkty
          rm pkty

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/

  release:
    name: Publish Release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist/

      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "pkty ${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
