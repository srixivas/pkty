name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture arm64
          # Restrict existing DEB822 sources to amd64 so they don't try to
          # fetch arm64 indexes from Azure/security mirrors that don't have them
          sudo python3 -c "
          import glob
          for p in glob.glob('/etc/apt/sources.list.d/*.sources'):
              t = open(p).read()
              if 'Architectures:' not in t:
                  t = t.replace('Components:', 'Architectures: amd64\nComponents:')
                  open(p, 'w').write(t)
          " 2>/dev/null || true
          # Add arm64 sources from ports.ubuntu.com
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe\n' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y libpcap-dev libpcap-dev:arm64 gcc-aarch64-linux-gnu

      - name: Build
        run: |
          go mod tidy
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_linux_amd64.tar.gz pkty
          rm pkty

          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
            go build -trimpath -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_linux_arm64.tar.gz pkty
          rm pkty

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: |
          go mod tidy
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_darwin_arm64.tar.gz pkty
          rm pkty

          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "${LDFLAGS}" -o pkty ./cmd/pkty
          tar -czf dist/pkty_darwin_amd64.tar.gz pkty
          rm pkty

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/

  release:
    name: Publish Release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist/

      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "pkty ${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
